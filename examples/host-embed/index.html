<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Host embed example</title>
  <style>
    body { font: 15px/1.5 sans-serif; margin: 1rem; }
    iframe { width: min(960px, 100%); height: 720px; border: 1px solid #ccc; }
    pre { background: #111; color: #eee; padding: 1rem; overflow: auto; max-height: 12rem; }
  </style>
</head>
<body>
  <h1>宿主嵌入示例</h1>
  <p>登录后把 Pavilo 放进 iframe。凭证只通过 postMessage 送入，不出现在地址里。</p>
  <form id="login">
    <label>用户名 <input name="username" value="ada"></label>
    <label>密码 <input name="password" type="password" value="ada"></label>
    <label>频道 <input name="channelId" value="staff"></label>
    <button type="submit">登录并嵌入</button>
    <button type="button" id="leave">拆掉嵌入</button>
  </form>
  <p>未读 <strong id="unread">0</strong> · 状态 <span id="status">idle</span></p>
  <div id="frame"></div>
  <pre id="log"></pre>
  <script src="/frame.js"></script>
  <script>
    const pavilo = '__PAVILO_URL__';
    const paviloOrigin = new URL(pavilo).origin;
    const log = document.getElementById('log');
    const frameHost = document.getElementById('frame');
    let iframe = null;

    function line(text) { log.textContent += text + '\n'; }

    async function signIdentity() {
      const body = Object.fromEntries(new FormData(document.getElementById('login')));
      const response = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const payload = await response.json();
      if (!payload.ok) return null;
      return { username: payload.username, channelId: body.channelId, identityToken: payload.identityToken };
    }

    function mount() {
      if (iframe) iframe.remove();
      iframe = document.createElement('iframe');
      iframe.title = 'Pavilo';
      iframe.src = pavilo.replace(/\/$/, '') + '/embed';
      frameHost.replaceChildren(iframe);
      attachPaviloFrame(iframe, pavilo, signIdentity);
    }

    window.addEventListener('message', (event) => {
      if (!iframe || event.origin !== paviloOrigin || event.source !== iframe.contentWindow) return;
      const data = event.data;
      if (!data || data.v !== 1 || data.source !== 'pavilo-embed' || data.type === 'hello') return;
      line(data.type + (data.channelId ? ' ' + data.channelId : '') + (data.code ? ' ' + data.code : '') + (data.status ? ' ' + data.status : ''));
      if (data.type === 'unread') document.getElementById('unread').textContent = String(data.count);
      if (data.type === 'connection' || data.type === 'ready' || data.type === 'identity-expired' || data.type === 'left') {
        document.getElementById('status').textContent = data.type === 'connection' ? data.status : data.type;
      }
      if (data.type === 'left') {
        iframe.remove();
        iframe = null;
      }
    });

    document.getElementById('login').addEventListener('submit', async (event) => {
      event.preventDefault();
      const body = Object.fromEntries(new FormData(event.target));
      const response = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const payload = await response.json();
      if (!payload.ok) { line('login failed'); return; }
      mount();
    });
    document.getElementById('leave').addEventListener('click', () => {
      if (iframe) iframe.remove();
      iframe = null;
      document.getElementById('status').textContent = 'removed';
    });
  </script>
</body>
</html>
